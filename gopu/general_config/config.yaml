{{ $gopu := printf "%s" "http://localhost:8080" }}
{{ $placeSlice := makeAnySlice "Great Pyramid at Giza" "Statue of Liberty" "Eiffel Tower" "Ayers Rock (Uluru)" "Mt. Kilimanjaro" "Taj Mahal" "Golden Gate Bridge" "Machu Picchu" "Brandenburg Gate" "CN Tower" }}
{{ $filesPath := printf "%s" "files/" }}
{{ $resultsPath := printf "%s" "results" }}
{{ $easySlice := makeIntSliceBySum 1000 }}
{{ $mediumSlice := makeIntSliceBySum 10000 }}
{{ $hardSlice := makeIntSliceBySum 100000 }}

scenarios:
  easyDist:
    config:
      workers: 10
      rps: 40
      duration: 5s
      output: {{ $resultsPath }}/easyDist.json"
    api:
    {{ range $placeSlice }}
    - url: {{ $gopu }}/distance
      method: POST
      data: 
        formula: "pythagoras"
        fromPlace: {{ . }}
        longitude: {{ getFloatInRange 21 90 }}
        latitude: {{ getFloatInRange -80 10 }}
      tags: [ "post", "pytha", "easyDist" ]
    {{ end }}
  mediumDist:
    config:
      workers: 30
      rps: 120
      duration: 5s
      output: {{ $resultsPath }}/mediumDist.json
    api:      
    {{ range $placeSlice }}
    - url: {{ $gopu }}/distance
      method: POST
      data: 
        formula: "pythagoras"
        fromPlace: {{ . }}
        longitude: {{ getFloatInRange 21 90 }}
        latitude: {{ getFloatInRange -80 10 }}
      tags: [ "post", "pytha", "mediumDist" ]
    {{ end }}
  hardDist:
    config:
      workers: 50
      rps: 200
      duration: 5s
      output: {{ $resultsPath }}/hardDist.json
    api:      
    {{ range $placeSlice }}
    - url: {{ $gopu }}/distance
      method: POST
      data: 
        formula: "pythagoras"
        fromPlace: {{ . }}
        longitude: {{ getFloatInRange 21 90 }}
        latitude: {{ getFloatInRange -80 10 }}
      tags: [ "post", "pytha", "hardDist" ]
    {{ end }}
  easyCalc:
    config:
      workers: 10
      rps: 50
      duration: 120s
      output: {{ $resultsPath }}/easyCalc.json
    api:
    {{ range $easySlice }}
      {{ $firstInt := getFloatInRange 5 10 }}
      {{ $secondInt := getFloatInRange 20 40 }}
      {{ $firstFloat := getFloatInRange 2 4 }}
      {{ $secondFloat := getFloatInRange 6 8 }}
    - url: {{ $gopu }}/plus
      method: POST
      payload: '[{{$firstFloat}},{{$secondFloat}}]'
      tags: [ "post", "plus", "easyPlus" ]
    - url: {{ $gopu }}/minus
      method: POST
      payload: '[{{$firstFloat}},{{$secondInt}}]'
    - url: {{ $gopu }}/multi
      method: POST
      payload: '[{{$firstInt}},{{$secondInt}}]'
    - url: {{ $gopu }}/divide
      method: POST
      payload: '[{{$firstFloat}},{{$secondInt}}]'
      tags: [ "post", "div", "easyDiv" ]
    {{ end }}
  mediumCalc:
    config:
      workers: 50
      rps: 200
      duration: 120s
      output: {{ $resultsPath }}/mediumCalc.json
    api:
    {{ range $mediumSlice }}
      {{ $firstInt := getFloatInRange 5 10 }}
      {{ $secondInt := getFloatInRange 20 40 }}
      {{ $firstFloat := getFloatInRange 2 4 }}
      {{ $secondFloat := getFloatInRange 6 8 }}
    - url: {{ $gopu }}/plus
      method: POST
      payload: '[{{$firstFloat}},{{$secondFloat}}]'
      tags: [ "plus", "mediumPlus"]
    - url: {{ $gopu }}/minus
      method: POST
      payload: '[{{$firstFloat}},{{$secondInt}}]'
    - url: {{ $gopu }}/multi
      method: POST
      payload: '[{{$firstInt}},{{$secondInt}}]'
      tags: ["multi"]
    - url: {{ $gopu }}/divide
      method: POST
      payload: '[{{$firstFloat}},{{$secondInt}}]'
      tags: [ "post", "div", "mediumDiv" ]
    {{ end }}
  hardCalc:
    config:
      workers: 100
      rps: 500
      duration: 120s
      output: {{ $resultsPath }}/hardCalc.json
    api:
    {{ range $hardSlice }}
      {{ $firstInt := getFloatInRange 5 10 }}
      {{ $secondInt := getFloatInRange 20 40 }}
      {{ $firstFloat := getFloatInRange 2 4 }}
      {{ $secondFloat := getFloatInRange 6 8 }}
    - url: {{ $gopu }}/plus
      method: POST
      payload: '[{{$firstFloat}},{{$secondFloat}}]'
    - url: {{ $gopu }}/minus
      method: POST
      payload: '[{{$firstFloat}},{{$secondInt}}]'
      tags: ["mini"]
    - url: {{ $gopu }}/multi
      method: POST
      payload: '[{{$firstInt}},{{$secondInt}}]'
    - url: {{ $gopu }}/divide
      method: POST
      payload: '[{{$firstFloat}},{{$secondInt}}]'
      tags: ["divi"]
    {{ end }}
  easyFiles: 
    config:
      workers: 10
      rps: 30
      duration: 12s
      output: {{ $resultsPath }}/easyFile.json 
    file:
    - url: {{ $gopu }}/pics
      method: POST
      directory: {{ $filesPath }}
    - url: {{ $gopu }}/docs
      method: PUT
      directory: {{ $filesPath }}
  mediumFiles: 
    config:
      workers: 15
      rps: 45
      duration: 12s
      output: {{ $resultsPath }}/mediumFile.json 
    file:
    - url: {{ $gopu }}/pics
      method: POST
      directory: {{ $filesPath }}
    - url: {{ $gopu }}/docs
      method: PUT
      directory: {{ $filesPath }}
  hardFiles: 
    config:
      workers: 30
      rps: 90
      duration: 12s
      output: {{ $resultsPath }}/hardFile.json 
    file:
    - url: {{ $gopu }}/pics
      method: POST
      directory: {{ $filesPath }}
    - url: {{ $gopu }}/docs
      method: PUT
      directory: {{ $filesPath }}
  easyLoc:  
    config:
      workers: 10
      rps: 40
      duration: 120s
      output: {{ $resultsPath }}/easyLoc.json
    api:
    {{ range $easySlice }}
    - url: {{ $gopu }}/locations/{{ . }}
      method: GET
    - url: {{ $gopu }}/locations
      method: GET
    - url: {{ $gopu }}/locations
      method: POST
      data: 
        name: {{ getRandStringInLength 6 }}
        address: {{ getRandStringInLength 24 }}
        longitude: {{ getFloatInRange 40 80 }}
        latitude: {{ getFloatInRange -80 -40 }}
      tags: ["postloc"]
    - url: {{ $gopu }}/locations
      method: POST
      payload: '{ "name": "{{ getRandStringInLength 10 }}", "address": "{{ getRandStringInLength 40 }}",  "longitude": {{ getFloatInRange 10 30 }}, "latitude": {{ getFloatInRange 20 40 }} }'
      tags: ["post","locations", "payload"]
    {{ end }}
  mediumLoc:  
    config:
      workers: 50
      rps: 200
      duration: 120s
      output: {{ $resultsPath }}/mediumLoc.json
    api:
    {{ range $mediumSlice }}
    - url: {{ $gopu }}/locations/{{ . }}
      method: GET
    - url: {{ $gopu }}/locations
      method: GET
    - url: {{ $gopu }}/locations
      method: POST
      data: 
        name: {{ getRandStringInLength 6 }}
        address: {{ getRandStringInLength 24 }}
        longitude: {{ getFloatInRange 40 80 }}
        latitude: {{ getFloatInRange -80 -40 }}
      tags: ["postloc"]
    - url: {{ $gopu }}/locations
      method: POST
      payload: '{ "name": "{{ getRandStringInLength 10 }}", "address": "{{ getRandStringInLength 40 }}",  "longitude": {{ getFloatInRange 10 30 }}, "latitude": {{ getFloatInRange 20 40 }} }'
      tags: ["post","locations", "payload"]
    {{ end }}
  hardLoc:  
    config:
      workers: 100
      rps: 500
      duration: 120s
      output: {{ $resultsPath }}/hardLoc.json
    api:
    {{ range $hardSlice }}
    - url: {{ $gopu }}/locations/{{ . }}
      method: GET
    - url: {{ $gopu }}/locations
      method: GET
    - url: {{ $gopu }}/locations
      method: POST
      data: 
        name: {{ getRandStringInLength 6 }}
        address: {{ getRandStringInLength 24 }}
        longitude: {{ getFloatInRange 40 80 }}
        latitude: {{ getFloatInRange -80 -40 }}
      tags: ["postloc"]
    - url: {{ $gopu }}/locations
      method: POST
      payload: '{ "name": "{{ getRandStringInLength 10 }}", "address": "{{ getRandStringInLength 40 }}",  "longitude": {{ getFloatInRange 10 30 }}, "latitude": {{ getFloatInRange 20 40 }} }'
      tags: ["post","locations", "payload", "hardLoc"]
    {{ end }}

