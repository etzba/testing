{{ $baseUrl := printf "%s" "http://localhost:8080" }}
{{ $sumSlice := makeIntSliceBySum 10 }}
api:
{{ range $sumSlice }}
  {{ $firstInt := getFloatInRange 5 10 }}
  {{ $secondInt := getFloatInRange 20 40 }}
  {{ $firstFloat := getFloatInRange 2 4 }}
  {{ $secondFloat := getFloatInRange 6 8 }}
- url: {{ $baseUrl }}/plus
  method: POST
  payload: '[{{$firstFloat}},{{$secondFloat}}]'
- url: {{ $baseUrl }}/minus
  method: POST
  payload: '[{{$firstFloat}},{{$secondInt}}]'
  tags: ["calc"]
- url: {{ $baseUrl }}/multi
  method: POST
  payload: '[{{$firstInt}},{{$secondInt}}]'
- url: {{ $baseUrl }}/divide
  method: POST
  payload: '[{{$firstFloat}},{{$secondInt}}]'
  tags: ["calc", "div"]
{{ end }}

checks:
  calc:
    statusCode:
      200:
        greaterThan: 55
        lessThan: 60
    taskDurations:
      minimum:
        fasterThan: 1.21ms
        slowerThan: 0.0052ms
      average:
        fasterThan: 2.21234ms
        slowerThan: 1.21ms
      maximum:
        fasterThan: 21.21234ms
        slowerThan: 13.212355ms
    tasksCount:
      total:
        greaterThan: 55
        lessThan: 60