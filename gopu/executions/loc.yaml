{{ $baseUrl := printf "%s" "http://localhost:8080" }}
{{ $slice := makeIntSliceBySum 1000 }}

api:
{{ range $slice }}
- url: {{ $baseUrl }}/locations/{{ . }}
  method: GET
- url: {{ $baseUrl }}/locations
  method: GET
- url: {{ $baseUrl }}/locations
  method: POST
  data: 
    name: {{ getRandStringInLength 6 }}
    address: {{ getRandStringInLength 24 }}
    longitude: {{ getFloatInRange 40 80 }}
    latitude: {{ getFloatInRange -80 -40 }}
  tags: ["postloc"]
- url: {{ $baseUrl }}/locations
  method: POST
  payload: '{ "name": "{{ getRandStringInLength 10 }}", "address": "{{ getRandStringInLength 40 }}",  "longitude": {{ getFloatInRange 10 30 }}, "latitude": {{ getFloatInRange 20 40 }} }'
  tags: ["post","locations", "payload"]
{{ end }}

checks:
  postloc:
    statusCode:
      200:
        greaterThan: 55
        lessThan: 60
    taskDurations:
      minimum:
        fasterThan: 1.21ms
        slowerThan: 0.0052ms
      average:
        fasterThan: 2.21234ms
        slowerThan: 1.21ms
      maximum:
        fasterThan: 21.21234ms
        slowerThan: 13.212355ms
    tasksCount:
      total:
        greaterThan: 55
        lessThan: 60