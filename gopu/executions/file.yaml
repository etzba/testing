{{ $baseUrl := printf "%s" "http://localhost:8080" }}
{{ $slice := makeIntSlice 1 2 3 4 }}
{{ $path := printf "%s" "files/" }}

file:
- url: {{ $baseUrl }}/pics
  method: POST
  directory: {{ $path }}
  tags: ["post","pics"]
- url: {{ $baseUrl }}/docs
  method: PUT
  directory: {{ $path }}
  tags: ["put","docs"]